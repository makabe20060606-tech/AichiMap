let markers = [];

// マーカー表示
function displaySpots(data){

    markers.forEach(marker => {
        map.removeLayer(marker);
    });

    markers = [];

    data.forEach(spot => {

        const marker = L.marker(
            [spot.lat, spot.lng]
        )

        .addTo(map)

        .bindPopup(`
            <h3>${spot.name}</h3>
            <p>${spot.genre}</p>
        `);

        markers.push(marker);

    });

}

// ジャンル絞り込み
function filterGenre(genre){

    const filtered = spots.filter(
        spot => spot.genre === genre
    );

    displaySpots(filtered);

}

// 全表示
function showAll(){
    displaySpots(spots);
}
